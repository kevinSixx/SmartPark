services:
  db:
    image: postgres:17
    container_name: smartpark_db

    environment:
      POSTGRES_DB: smartpark
      POSTGRES_USER: smartpark
      POSTGRES_PASSWORD: smartpark_dev

    ports:
      - "5432:5432"

    volumes:
      - smartpark_postgres_data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    container_name: smartpark_mqtt

    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  smartpark_postgres_data: